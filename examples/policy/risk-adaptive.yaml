# Opt-in risk-adaptive governance (PRODUCT_INTENT §13 / P1 #1).
# Merge into .specular/policy.yaml. Without this block, gate Risk is
# advisory only and never flips ALLOW→DENY.
risk:
  low:
    approval: none
  medium:
    approval:
      - code-owner
  high:
    approvals:
      - security
      - service-owner
  critical:
    autonomous_execution: false
    approvals:
      - security
      - platform
