# GitLab CI/CD Pipeline for Specular AI Change Control
# Change-control entrypoint: specular gate (PRODUCT_INTENT gate-first)
# Exit codes: 0=ALLOW, 3=policy DENY, 4=drift DENY
#
# Prefer this over calling specular eval drift directly in CI.

# Define stages
stages:
  - validate
  - plan
  - build
  - gate
  - report

# Global variables
variables:
  SPECULAR_VERSION: "latest"
  SPECULAR_NO_TELEMETRY: "true"
  SPEC_FILE: ".specular/spec.yaml"
  LOCK_FILE: ".specular/spec.lock.json"
  PLAN_FILE: "plan.json"
  POLICY_FILE: ".specular/policy.yaml"

# Install Specular binary (reusable script)
.install_specular: &install_specular
  - |
    echo "Installing Specular ${SPECULAR_VERSION}..."
    OS=$(uname -s | tr '[:upper:]' '[:lower:]')
    ARCH=$(uname -m)
    case "$ARCH" in
      x86_64) ARCH="amd64" ;;
      aarch64|arm64) ARCH="arm64" ;;
    esac
    if [ "$SPECULAR_VERSION" = "latest" ]; then
      DOWNLOAD_URL="https://github.com/felixgeelhaar/specular/releases/latest/download/specular_${OS}_${ARCH}.tar.gz"
    else
      DOWNLOAD_URL="https://github.com/felixgeelhaar/specular/releases/download/${SPECULAR_VERSION}/specular_${OS}_${ARCH}.tar.gz"
    fi
    curl -fsSL "$DOWNLOAD_URL" | tar -xz -C /usr/local/bin specular
    chmod +x /usr/local/bin/specular
    specular version

# Validate specification
validate_spec:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache curl tar bash
    - *install_specular
  script:
    - echo "Locking and validating specification..."
    - specular spec lock --in "$SPEC_FILE" --out "$LOCK_FILE"
    - echo "Specification validated successfully"
  artifacts:
    paths:
      - $LOCK_FILE
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Run system diagnostics
system_health:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache curl tar bash
    - *install_specular
  script:
    - echo "Running system diagnostics..."
    - specular doctor --format json | tee doctor-output.json || true
  artifacts:
    paths:
      - doctor-output.json
    expire_in: 1 day
  allow_failure: true

# Generate execution plan
generate_plan:
  stage: plan
  image: alpine:latest
  needs:
    - validate_spec
  before_script:
    - apk add --no-cache curl tar bash
    - *install_specular
  script:
    - echo "Generating execution plan..."
    - specular plan create --in "$SPEC_FILE" --lock "$LOCK_FILE" --out "$PLAN_FILE"
    - echo "Plan generated successfully"
  artifacts:
    paths:
      - $PLAN_FILE
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Change-control gate (MRs) — ALLOW/DENY with markdown for MR comments
change_control_gate:
  stage: gate
  image: alpine:latest
  needs:
    - validate_spec
  before_script:
    - apk add --no-cache curl tar bash jq
    - *install_specular
  script:
    - echo "Running specular gate (change-control entrypoint)..."
    - |
      set +e
      # Non-interactive; markdown for MR notes. Add --strict-spec when specs are required.
      # --github-annotations is GitHub-only — omit here.
      specular gate --format markdown --policy "$POLICY_FILE" --report .specular/drift.sarif > gate.md
      EXIT_CODE=$?
      set -e

      cat gate.md

      case "$EXIT_CODE" in
        0) echo "✅ Gate ALLOW" ;;
        3) echo "❌ Gate DENY (policy)" ;;
        4) echo "❌ Gate DENY (drift)" ;;
        *) echo "❌ Gate failed (exit $EXIT_CODE)" ;;
      esac

      exit $EXIT_CODE
  artifacts:
    when: always
    paths:
      - gate.md
      - .specular/drift.sarif
      - .specular/evidence/
    reports:
      sast: .specular/drift.sarif
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: false

# Build execution (protected branches only)
execute_build:
  stage: build
  image: alpine:latest
  needs:
    - generate_plan
  before_script:
    - apk add --no-cache curl tar bash docker
    - *install_specular
  script:
    - echo "Executing build with policy enforcement..."
    - specular build run --plan "$PLAN_FILE" --policy "$POLICY_FILE"
  artifacts:
    paths:
      - .specular/runs/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  services:
    - docker:dind

# Generate compliance report from gate SARIF (when present)
compliance_report:
  stage: report
  image: alpine:latest
  needs:
    - job: change_control_gate
      optional: true
  before_script:
    - apk add --no-cache jq
  script:
    - |
      echo "Generating compliance report..."

      if [ -f ".specular/drift.sarif" ]; then
        TOTAL_ISSUES=$(jq '.runs[0].results | length' .specular/drift.sarif)
        CRITICAL=$(jq '[.runs[0].results[] | select(.level == "error")] | length' .specular/drift.sarif)
        WARNING=$(jq '[.runs[0].results[] | select(.level == "warning")] | length' .specular/drift.sarif)

        cat > compliance-report.json <<EOF
      {
        "timestamp": "$(date -Iseconds)",
        "commit": "$CI_COMMIT_SHA",
        "branch": "$CI_COMMIT_BRANCH",
        "total_issues": $TOTAL_ISSUES,
        "critical": $CRITICAL,
        "warnings": $WARNING,
        "passed": $([ "$TOTAL_ISSUES" -eq 0 ] && echo "true" || echo "false")
      }
      EOF

        cat compliance-report.json
      else
        echo "No drift SARIF from gate; skipping SARIF rollup."
      fi
  artifacts:
    paths:
      - compliance-report.json
    expire_in: 90 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# Post MR comment with gate markdown (requires GitLab API token).
# Upserts on the stable "## Specular Change Control" marker (same as GitHub).
post_mr_comment:
  stage: report
  image: alpine:latest
  needs:
    - job: change_control_gate
      optional: true
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ ! -f "gate.md" ] || [ -z "$CI_MERGE_REQUEST_IID" ]; then
        echo "No gate.md or MR iid — skip comment."
        exit 0
      fi
      if [ -z "${GITLAB_API_TOKEN:-}" ]; then
        echo "GITLAB_API_TOKEN unset — skip MR note upsert."
        exit 0
      fi
      GATE_MARKER="## Specular Change Control"
      BODY=$(jq -Rs . < gate.md)
      NOTES_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
      EXISTING_ID=$(curl -fsSL --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
        "$NOTES_URL?per_page=100" \
        | jq -r --arg m "$GATE_MARKER" '
            [.[] | select(.body | startswith($m))] | .[0].id // empty
          ')
      if [ -n "$EXISTING_ID" ]; then
        echo "Updating MR note $EXISTING_ID"
        curl -fsSL --request PUT \
          --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
          --header "Content-Type: application/json" \
          --data "{\"body\": $BODY}" \
          "$NOTES_URL/$EXISTING_ID" >/dev/null
      else
        echo "Creating MR note"
        curl -fsSL --request POST \
          --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
          --header "Content-Type: application/json" \
          --data "{\"body\": $BODY}" \
          "$NOTES_URL" >/dev/null
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
  allow_failure: true
