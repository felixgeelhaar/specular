version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gosec
    - gocritic
    - gocyclo
    - dupl

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    govet:
      enable-all: true
      disable:
        - fieldalignment
      settings:
        shadow:
          strict: true

    gocyclo:
      min-complexity: 15

    dupl:
      threshold: 100

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - whyNoLint
        - hugeParam
        - rangeValCopy
        - emptyStringTest
        - appendAssign
        - ifElseChain
        - paramTypeCombine

    gosec:
      excludes:
        - G204
        - G304

    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - govet
          - gocritic

      - path: test/e2e/
        linters:
          - errcheck
          - gosec
          - govet

      - path: internal/(exec|eval|workflow)/
        linters:
          - govet
          - dupl
          - errcheck
          - gosec
          - gocyclo

      - path: internal/(plan|policy|prd)/
        linters:
          - govet
          - gosec
          - unused

      - path: internal/interview/
        linters:
          - gocritic
          - staticcheck
          - revive
          - gocyclo

      - path: internal/progress/
        linters:
          - errcheck

      - path: internal/provider/
        linters:
          - govet
          - dupl
          - errcheck
          - gosec
          - ineffassign
          - gocyclo
          - staticcheck

      - path: internal/router/
        linters:
          - govet
          - gosec
          - gocyclo
          - errcheck
          - gocritic
          - revive
          - staticcheck

      - path: internal/spec/
        linters:
          - govet
          - gosec
          - errcheck
          - gocritic

      - path: providers/
        linters:
          - gocyclo
          - govet
          - errcheck
          - gosec

      - path: internal/auto/
        linters:
          - gocyclo
          - govet
          - errcheck
          - gocritic
          - gosec
          - staticcheck
          - dupl

      - path: internal/tui/
        linters:
          - gocyclo
          - govet

      - path: internal/trace/
        linters:
          - errcheck
          - govet
          - gosec

      - path: internal/attestation/
        linters:
          - gocyclo
          - errcheck

      - path: internal/security/
        linters:
          - govet
          - errcheck
          - gosec
          - revive

      - path: internal/autopolicy/
        linters:
          - staticcheck

      - path: internal/patch/
        linters:
          - govet
          - gosec
          - gocyclo
          - staticcheck
          - revive

      - path: internal/profiles/
        linters:
          - govet
          - errcheck
          - gocyclo

      - path: internal/ux/
        linters:
          - errcheck
          - govet

      - path: internal/cmd/
        linters:
          - errcheck
          - gocyclo
          - dupl
          - govet
          - gosec
          - staticcheck

      - path: internal/domain/
        linters:
          - dupl

      - path: internal/hooks/
        linters:
          - govet
          - errcheck
          - revive
          - gocritic

      - path: internal/explain/
        linters:
          - dupl

      - path: internal/drift/
        linters:
          - unconvert

      - path: internal/license/
        linters:
          - errcheck
          - govet
          - gosec

      - path: internal/platform/
        linters:
          - errcheck
          - govet

      - path: internal/plugin/
        linters:
          - errcheck
          - govet
          - dupl

      - path: internal/telemetry/
        linters:
          - govet

      - path: examples/
        linters:
          - errcheck
          - gosec
          - govet

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/felixgeelhaar/specular

output:
  formats:
    text:
      path: stdout
      colors: true
      print-linter-name: true
