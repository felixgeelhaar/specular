# Example: Continuous Build with Specular
#
# This workflow implements spec-first continuous builds:
# 1. Generates spec from PRD on changes
# 2. Generates execution plan
# 3. Executes build with policy enforcement
# 4. Runs comprehensive validation
#
# To use this workflow:
# 1. Copy to .github/workflows/continuous-build.yml
# 2. Set up required secrets for AI providers
# 3. Configure policy file and build settings

name: Continuous Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'PRD.md'
      - '.specular/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  spec-generation:
    name: Generate Specification
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'PRD.md')

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Generate Spec from PRD
        uses: ./
        with:
          command: 'spec'
          prd-file: 'PRD.md'
          spec-file: '.specular/spec.yaml'
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional-args: '--verbose'

      - name: Upload Spec Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: specification
          path: .specular/spec.yaml
          retention-days: 30

  plan-generation:
    name: Generate Build Plan
    runs-on: ubuntu-latest
    needs: [ spec-generation ]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download Spec
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: specification
          path: .specular/

      - name: Generate Build Plan
        uses: ./
        with:
          command: 'plan'
          spec-file: '.specular/spec.yaml'
          lock-file: '.specular/spec.lock.json'
          plan-file: 'build-plan.json'
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-plan
          path: build-plan.json
          retention-days: 7

  build:
    name: Execute Build
    runs-on: ubuntu-latest
    needs: [ plan-generation ]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Docker
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Download Build Plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-plan

      - name: Execute Build with Policy Enforcement
        uses: ./
        with:
          command: 'build'
          plan-file: 'build-plan.json'
          policy-file: '.specular/policy.yaml'
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional-args: '--resume --verbose'

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-output
          path: |
            .specular/runs/
            **/*.log
          retention-days: 7

  validate:
    name: Validate Build
    runs-on: ubuntu-latest
    needs: [ build ]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download Build Plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-plan

      - name: Download Spec
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: specification
          path: .specular/

      - name: Run Drift Detection
        uses: ./
        with:
          command: 'drift'
          spec-file: '.specular/spec.yaml'
          lock-file: '.specular/spec.lock.json'
          plan-file: 'build-plan.json'
          policy-file: '.specular/policy.yaml'
          sarif-output: 'validation-report.sarif'
          fail-on: 'drift'
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: validation-report.sarif
          category: specular-build-validation
