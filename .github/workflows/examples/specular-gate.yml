# Example: Specular gate as a GitHub PR check
#
# Primary change-control primitive — ALLOW / DENY for the working tree.
# Brownfield: repositories without .specular/spec soft-skip drift unless
# --strict-spec is passed.
#
# Usage:
#   1. Copy to .github/workflows/specular-gate.yml
#   2. Ensure the specular binary is available (install step below)
#   3. Optionally set fail-on drift/policy via exit codes (3=policy, 4=drift)

name: Specular Gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: specular gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install Specular
        run: go install github.com/felixgeelhaar/specular/cmd/specular@latest

      - name: Run gate
        id: gate
        run: |
          set +e
          specular gate --json > gate.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat gate.json
          # 0 = ALLOW; 3 = policy DENY; 4 = drift DENY
          exit "$code"

      - name: Comment ALLOW/DENY on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Specular gate\n\n';
            if (fs.existsSync('gate.json')) {
              const res = JSON.parse(fs.readFileSync('gate.json', 'utf8'));
              body += `**Verdict:** \`${res.verdict}\`\n\n`;
              body += `**Reason:** ${res.reason || '(none)'}\n\n`;
              if (res.drift && res.drift.findings && res.drift.findings.length) {
                body += '### Drift findings\n\n';
                res.drift.findings.slice(0, 8).forEach(f => {
                  body += `- **[${f.severity}] ${f.code}** (${f.category})`;
                  if (f.message) body += `: ${f.message}`;
                  if (f.location) body += ` _at ${f.location}_`;
                  body += '\n';
                });
              }
            } else {
              body += '_gate.json missing — see job logs._\n';
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## Specular gate';
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
