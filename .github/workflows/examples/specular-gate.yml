# Example: Specular gate as a GitHub PR check
#
# Uses native markdown + file annotations from the CLI
# (PRODUCT_INTENT §21 — Excellent GitHub PR/check UX).
#
# Usage:
#   1. Copy to .github/workflows/specular-gate.yml
#   2. Ensure the specular binary is available (install step below)
#   Exit codes: 0=ALLOW, 3=policy DENY, 4=drift DENY

name: Specular Gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  gate:
    name: specular gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Specular
        run: go install github.com/felixgeelhaar/specular/cmd/specular@latest

      - name: Run gate
        id: gate
        run: |
          set +e
          specular gate --format markdown --github-annotations > gate.md 2>gate.annotations
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Surface file annotations in the Checks UI
          cat gate.annotations >&2 || true
          # Job summary + keep artifact for the PR comment step
          cat gate.md >> "$GITHUB_STEP_SUMMARY"
          cat gate.md
          exit "$code"

      - name: Upload drift SARIF
        if: always() && hashFiles('drift.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: drift.sarif
          category: specular-gate

      - name: Comment ALLOW/DENY on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '## Specular Change Control';
            let body = marker + '\n\n_gate.md missing — see job logs._\n';
            if (fs.existsSync('gate.md')) {
              body = fs.readFileSync('gate.md', 'utf8');
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
