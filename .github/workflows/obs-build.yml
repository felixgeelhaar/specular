name: Publish to OBS

on:
  release:
    types: [published]

jobs:
  obs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - name: Install osc
        run: |
          sudo apt-get update
          sudo apt-get install -y osc
      - name: Configure OBS credentials
        run: |
          cat <<'EOF' > ~/.oscrc
          [general]
          username = ${{ secrets.OBS_USERNAME }}
          password = ${{ secrets.OBS_PASSWORD }}
          apiurl = ${{ secrets.OBS_API_URL }}
          EOF
      - name: Publish OBS package
        run: scripts/obs/build.sh
        env:
          OBS_PROJECT: ${{ secrets.OBS_PROJECT }}
          OBS_API_URL: ${{ secrets.OBS_API_URL }}
          SPECULAR_VERSION: ${{ github.tag_name }}
