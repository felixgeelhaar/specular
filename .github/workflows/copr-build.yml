name: Build RPM via Copr

on:
  release:
    types: [published]

jobs:
  copr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm curl
          sudo gem install --no-document fpm
          pip install --no-cache-dir copr-cli
      - name: Configure Copr credentials
        run: |
          mkdir -p ~/.config/copr
          cat <<'EOF' > ~/.config/copr/coprc
          username = ${{ secrets.COPR_USERNAME }}
          api_token = ${{ secrets.COPR_API_TOKEN }}
          EOF
      - name: Build Copr package
        run: scripts/copr/build.sh
        env:
          COPR_PROJECT: ${{ secrets.COPR_PROJECT }}
          COPR_CHROOTS: fedora-40,fedora-rawhide
          SPECULAR_VERSION: ${{ github.tag_name }}
