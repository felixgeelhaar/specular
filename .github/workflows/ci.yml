name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Combined lint, build, and quick validation
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          args: --timeout=5m
      - name: Run Guardrail
        run: make guardrail

      - name: Build
        run: make build

      - name: Verify binary
        run: ./specular version

  # Core tests (Linux only for cost efficiency)
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Install coverctl
        run: go install github.com/felixgeelhaar/coverctl/cmd/coverctl@latest

      - name: Check coverage with coverctl
        run: coverctl report --profile coverage.out

  # E2E tests (only if main tests pass)
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Run E2E tests
        run: make test-e2e
        env:
          SKIP_DOCKER_TESTS: "true"

  # macOS tests - push-to-main + label-gated PRs.
  # macOS runners cost 10x Actions minutes on public repos; default PRs
  # skip them. Add the `test-macos` label to a PR to opt in.
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-macos'))
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests
        run: go test -v -race ./...

  # Security scan. Runs on pushes to main as well as PRs: code scanning needs
  # a default-branch baseline to tell a net-new alert from a pre-existing one,
  # and a PR-only scan never establishes it.
  #
  # This replaces VerdictSec, which was installed from @latest (a discontinued
  # upstream) and run as `verdict scan ... || true` — a check that reported
  # green whether it found nothing, failed, or never ran.
  #
  # Actions in this job are pinned by digest even though the rest of this file
  # uses floating tags: an unpinned action here can substitute the scanner.
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write   # nox annotate
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nox (pinned + sha256-verified binary)
        # Bump NOX_VERSION and NOX_SHA256 together; verify the new sha256
        # against the published tarball rather than copying it from a diff.
        env:
          NOX_VERSION: "1.26.0"
          NOX_SHA256: "6879f8c7b523ebab9920d40919917b422bb952f9252fbadde9061cb37827793c"
        run: |
          curl -sL -o nox.tar.gz \
            "https://github.com/nox-hq/nox/releases/download/v${NOX_VERSION}/nox_${NOX_VERSION}_linux_amd64.tar.gz"
          echo "${NOX_SHA256}  nox.tar.gz" | sha256sum -c -
          tar xzf nox.tar.gz && sudo mv nox /usr/local/bin/ && nox version

      - name: Install cosign
        # nox verifies plugin signatures by shelling out to cosign. Without it,
        # signed plugins cannot be promoted past "unverified" and install is
        # blocked under the default community-trust policy.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install taint-analysis plugin
        # nox owns code-level SAST here: source-to-sink taint (SSRF, injection,
        # path traversal). The install is asserted rather than best-effort — a
        # registry outage would otherwise produce zero taint findings, which is
        # indistinguishable from a clean scan. Absence of coverage must not be
        # reported as absence of findings. Re-run the job if the registry 404s.
        run: |
          nox plugin install nox/taint-analysis
          nox plugin list | grep -q '^nox/taint-analysis' || {
            echo "::error::taint-analysis plugin is not installed; this scan would have no SAST coverage."
            exit 1
          }

      - name: Scan
        # Release binaries exit non-zero on any unsuppressed finding; the gate
        # step below decides what is actually fatal (net-new critical/high).
        run: nox scan . -format json,sarif -output nox-results || true

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('nox-results/findings.sarif') != ''
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: nox-results/findings.sarif

      - name: Annotate PR
        if: github.event_name == 'pull_request' && hashFiles('nox-results/findings.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nox annotate -input nox-results/findings.json || true

      - name: Gate on net-new critical/high findings
        # Self-adjusting: enforce only once this repo has an established nox
        # baseline (at least one finding marked "baselined"). Until then the
        # job is report-only, so adopting the scanner cannot turn the build red
        # on day one — run `nox baseline add` and commit .nox/ to enforce.
        if: always() && hashFiles('nox-results/findings.json') != ''
        run: |
          f=nox-results/findings.json
          baselined=$(jq '[.findings[]? | select(.Status=="baselined")] | length' "$f" 2>/dev/null || echo 0)
          new=$(jq '[.findings[]? | select((.Severity=="critical" or .Severity=="high") and (.Status!="baselined"))] | length' "$f" 2>/dev/null || echo 0)
          echo "net-new critical/high: $new (baselined findings: $baselined)"
          if [ "$baselined" -eq 0 ]; then
            echo "::notice::No nox baseline established — security gate is report-only. Run 'nox baseline add' and commit .nox/ to enforce net-new critical/high."
            exit 0
          fi
          if [ "$new" -gt 0 ]; then
            echo "::error::Net-new critical/high findings. Run 'nox baseline add' or remediate."
            jq '.findings[] | select((.Severity=="critical" or .Severity=="high") and (.Status!="baselined")) | {severity:.Severity, rule:.RuleID, file:.Location.FilePath, line:.Location.StartLine}' "$f"
            exit 1
          fi

      - name: Upload nox artifacts
        if: always() && hashFiles('nox-results/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nox-results
          path: nox-results/
          retention-days: 7
