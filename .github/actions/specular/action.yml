name: 'Specular AI Governance'
description: 'Run Specular spec validation, planning, building, and drift detection in your CI/CD pipeline'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  version:
    description: 'Specular version to install (default: latest)'
    required: false
    default: 'latest'

  command:
    description: 'Specular command to run (spec, plan, build, eval, drift, doctor)'
    required: true

  spec-file:
    description: 'Path to spec.yaml file'
    required: false
    default: '.specular/spec.yaml'

  prd-file:
    description: 'Path to PRD markdown file (optional, used to generate spec)'
    required: false
    default: ''

  lock-file:
    description: 'Path to spec.lock.json file'
    required: false
    default: '.specular/spec.lock.json'

  plan-file:
    description: 'Path to plan.json file'
    required: false
    default: 'plan.json'

  policy-file:
    description: 'Path to policy.yaml file'
    required: false
    default: '.specular/policy.yaml'

  scenario:
    description: 'Eval scenario (smoke, integration, security, performance)'
    required: false
    default: 'smoke'

  fail-on:
    description: 'Fail conditions for drift command'
    required: false
    default: 'drift,test,security'

  sarif-output:
    description: 'Path to SARIF output file'
    required: false
    default: 'specular-results.sarif'

  upload-sarif:
    description: 'Upload SARIF to code scanning'
    required: false
    default: 'true'

  anthropic-api-key:
    description: 'Anthropic API key for Claude models'
    required: false

  openai-api-key:
    description: 'OpenAI API key for GPT models'
    required: false

  gemini-api-key:
    description: 'Google Gemini API key'
    required: false

  additional-args:
    description: 'Additional arguments to pass to specular command'
    required: false
    default: ''

outputs:
  result:
    description: 'Command execution result (success/failure)'
    value: ${{ steps.run-specular.outputs.result }}

  drift-count:
    description: 'Number of drift violations detected'
    value: ${{ steps.check-drift.outputs.drift-count }}

  sarif-file:
    description: 'Path to generated SARIF file'
    value: ${{ steps.check-drift.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Install Specular
      id: install
      shell: bash
      run: |
        echo "::group::Installing Specular ${{ inputs.version }}"

        # Determine OS and architecture
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)

        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64|arm64) ARCH="arm64" ;;
        esac

        # Download URL
        if [ "${{ inputs.version }}" = "latest" ]; then
          DOWNLOAD_URL="https://github.com/felixgeelhaar/specular/releases/latest/download/specular_${OS}_${ARCH}.tar.gz"
        else
          DOWNLOAD_URL="https://github.com/felixgeelhaar/specular/releases/download/${{ inputs.version }}/specular_${OS}_${ARCH}.tar.gz"
        fi

        echo "Downloading from: $DOWNLOAD_URL"

        # Download and extract
        curl -fsSL "$DOWNLOAD_URL" | tar -xz -C /usr/local/bin specular
        chmod +x /usr/local/bin/specular

        # Verify installation
        specular version

        echo "::endgroup::"

    - name: Setup environment
      id: setup-env
      shell: bash
      run: |
        echo "::group::Setting up environment"

        # Set API keys if provided
        if [ -n "${{ inputs.anthropic-api-key }}" ]; then
          echo "ANTHROPIC_API_KEY=${{ inputs.anthropic-api-key }}" >> $GITHUB_ENV
        fi

        if [ -n "${{ inputs.openai-api-key }}" ]; then
          echo "OPENAI_API_KEY=${{ inputs.openai-api-key }}" >> $GITHUB_ENV
        fi

        if [ -n "${{ inputs.gemini-api-key }}" ]; then
          echo "GEMINI_API_KEY=${{ inputs.gemini-api-key }}" >> $GITHUB_ENV
        fi

        # Disable telemetry in CI
        echo "SPECULAR_NO_TELEMETRY=true" >> $GITHUB_ENV

        echo "::endgroup::"

    - name: Run Specular diagnostics
      id: doctor
      shell: bash
      run: |
        echo "::group::Running system diagnostics"
        specular doctor --format json || true
        echo "::endgroup::"

    - name: Run Specular command
      id: run-specular
      shell: bash
      run: |
        echo "::group::Running specular ${{ inputs.command }}"

        set +e  # Don't exit on error

        case "${{ inputs.command }}" in
          spec)
            if [ -n "${{ inputs.prd-file }}" ]; then
              specular spec new \
                --from "${{ inputs.prd-file }}" \
                --out "${{ inputs.spec-file }}" \
                ${{ inputs.additional-args }}
              EXIT_CODE=$?
            else
              EXIT_CODE=0
            fi

            if [ $EXIT_CODE -ne 0 ]; then
              break
            fi

            specular spec validate \
              --in "${{ inputs.spec-file }}" \
              ${{ inputs.additional-args }}
            EXIT_CODE=$?

            if [ $EXIT_CODE -eq 0 ]; then
              specular spec lock \
                --in "${{ inputs.spec-file }}" \
                --out "${{ inputs.lock-file }}" \
                ${{ inputs.additional-args }}
              EXIT_CODE=$?
            fi
            ;;

          plan)
            specular plan create \
              --in "${{ inputs.spec-file }}" \
              --lock "${{ inputs.lock-file }}" \
              --out "${{ inputs.plan-file }}" \
              ${{ inputs.additional-args }}
            EXIT_CODE=$?
            ;;

          build)
            specular build run \
              --plan "${{ inputs.plan-file }}" \
              --policy "${{ inputs.policy-file }}" \
              ${{ inputs.additional-args }}
            EXIT_CODE=$?
            ;;

          eval)
            specular eval run \
              --scenario "${{ inputs.scenario }}" \
              --policy "${{ inputs.policy-file }}" \
              ${{ inputs.additional-args }}
            EXIT_CODE=$?
            ;;

          drift)
            FAIL_ON_DRIFT=""
            if [[ "${{ inputs.fail-on }}" == *drift* ]]; then
              FAIL_ON_DRIFT="--fail-on-drift"
            fi

            specular eval drift \
              --spec "${{ inputs.spec-file }}" \
              --plan "${{ inputs.plan-file }}" \
              --lock "${{ inputs.lock-file }}" \
              --policy "${{ inputs.policy-file }}" \
              --report "${{ inputs.sarif-output }}" \
              $FAIL_ON_DRIFT \
              ${{ inputs.additional-args }}
            EXIT_CODE=$?
            ;;

          doctor)
            specular doctor ${{ inputs.additional-args }}
            EXIT_CODE=$?
            ;;

          *)
            specular ${{ inputs.command }} ${{ inputs.additional-args }}
            EXIT_CODE=$?
            ;;
        esac

        echo "exit-code=$EXIT_CODE" >> $GITHUB_OUTPUT

        if [ $EXIT_CODE -eq 0 ]; then
          echo "result=success" >> $GITHUB_OUTPUT
        else
          echo "result=failure" >> $GITHUB_OUTPUT
        fi

        echo "::endgroup::"

        exit $EXIT_CODE

    - name: Check for drift
      id: check-drift
      if: always() && inputs.command == 'drift'
      shell: bash
      run: |
        echo "::group::Checking for drift"

        REPORT_FILE="${{ inputs.sarif-output }}"

        if [ -f "$REPORT_FILE" ]; then
          DRIFT_COUNT=$(jq '.runs[0].results | length' "$REPORT_FILE" 2>/dev/null || echo "0")
          echo "drift-count=$DRIFT_COUNT" >> $GITHUB_OUTPUT
          echo "sarif-file=$REPORT_FILE" >> $GITHUB_OUTPUT

          if [ "$DRIFT_COUNT" -gt 0 ]; then
            echo "::warning::Drift detected: $DRIFT_COUNT issue(s) found"
            jq -r '.runs[0].results[] | "::warning file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.message.text)"' "$REPORT_FILE" || true
          fi
        else
          echo "drift-count=0" >> $GITHUB_OUTPUT
        fi

        echo "::endgroup::"

    - name: Upload SARIF report
      if: always() && inputs.command == 'drift' && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
      with:
        sarif_file: ${{ inputs.sarif-output }}
        category: specular-drift
      continue-on-error: true

    - name: Fail on drift
      if: steps.check-drift.outputs.drift-count != '0' && contains(inputs.fail-on, 'drift')
      shell: bash
      run: |
        echo "::error::Drift detected and fail-on includes drift"
        exit 4
