# Specular Security Policy
# Generated by: specular init
# Governance Level: L2
# Date: 2026-01-09 16:23:37

# Allowed Docker images
allowed_images:
  - "alpine:latest"
  - "node:20-alpine"
  - "python:3.11-alpine"
  - "golang:1.21-alpine"

# Network access policy
network:
  allow_internet: false
  allowed_domains:
    - "github.com"
    - "npmjs.com"
    - "pypi.org"

# Filesystem access policy
filesystem:
  mode: limited  # limited, full
  allowed_paths:
    - "/app"
    - "/tmp"

# Resource limits
resources:
  max_memory_mb: 512
  max_cpu_percent: 50
  max_execution_time_minutes: 10

# Privacy settings
privacy:
  telemetry: false
  upload_code: false
  share_metrics: false
