# Specular Router Configuration
# Generated by: specular init
# Date: 2026-01-09 16:23:37

# Budget configuration
budget:
  max_cost: 100.0
  remaining: 100.0

# Performance constraints
max_latency_ms: 5000

# Cost preferences
prefer_cheap: false

# Fallback and retry configuration
enable_fallback: true
max_retries: 3

# Context handling
validate_context: true
auto_truncate: true

# Provider configuration
providers:
  - name: ollama
    enabled: false
    type: local
    base_url: http://localhost:11434

  - name: openai
    enabled: false
    type: api
    env_var: OPENAI_API_KEY

  - name: anthropic
    enabled: false
    type: api
    env_var: ANTHROPIC_API_KEY

  - name: gemini
    enabled: false
    type: api
    env_var: GEMINI_API_KEY
