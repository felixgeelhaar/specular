# Coverctl Configuration for Specular
# https://github.com/felixgeelhaar/coverctl

version: 1

policy:
  # Default minimum coverage threshold
  default:
    min: 40

  # Domain definitions for coverage tracking
  domains:
    - name: core
      description: Core business logic
      match:
        - ./internal/spec/...
        - ./internal/plan/...
        - ./internal/drift/...
        - ./internal/policy/...
        - ./internal/eval/...
      min: 85

    - name: providers
      description: AI provider integrations
      match:
        - ./internal/provider/...
        - ./internal/router/...
      min: 75

    - name: execution
      description: Execution and sandboxing
      match:
        - ./internal/exec/...
        - ./internal/checkpoint/...
        - ./internal/workflow/...
        - ./internal/auto/...
      min: 40

    - name: security
      description: Security and authentication
      match:
        - ./internal/auth/...
        - ./internal/authz/...
        - ./internal/security/...
        - ./internal/vault/...
        - ./internal/awssm/...
      min: 55

    - name: observability
      description: Logging, metrics, and tracing
      match:
        - ./internal/log/...
        - ./internal/metrics/...
        - ./internal/telemetry/...
        - ./internal/health/...
        - ./internal/slo/...
        - ./internal/alerting/...
        - ./internal/logexport/...
      min: 75

    - name: cli
      description: CLI commands and UX
      match:
        - ./internal/cmd/...
        - ./internal/ux/...
        - ./internal/tui/...
        - ./internal/interview/...
      min: 15

    - name: sdk
      description: Public SDK and types
      match:
        - ./pkg/...
      min: 65

# Exclude patterns
exclude:
  - "**/testdata/**"
  - "**/mocks/**"
  - "**/*_test.go"
  - "**/examples/**"
  - "cmd/specular/main.go"

# Ratchet mode - fail if coverage decreases
ratchet: true

# Output settings
output:
  format: text
  verbose: false
