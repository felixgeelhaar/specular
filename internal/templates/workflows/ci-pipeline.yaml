id: ci-pipeline
name: CI/CD Pipeline
description: GitHub Actions CI/CD pipeline with testing, linting, and deployment
category: ci
tags:
  - github-actions
  - ci
  - cd
  - testing
  - deployment

variables:
  - name: project_name
    description: Name of the project
    type: string
    required: true
  - name: language
    description: Primary programming language
    type: choice
    required: true
    choices:
      - go
      - typescript
      - python
      - rust
    default: go
  - name: deploy_target
    description: Deployment target
    type: choice
    required: false
    choices:
      - kubernetes
      - docker
      - serverless
      - none
    default: docker
  - name: enable_security_scan
    description: Enable security scanning
    type: boolean
    required: false
    default: "true"

files:
  - path: .github/workflows/ci.yaml
    description: Main CI workflow for testing and building
    template: |
      name: CI

      on:
        push:
          branches: [main, develop]
        pull_request:
          branches: [main]

      env:
        PROJECT_NAME: {{.project_name}}

      jobs:
        lint:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            {{if eq .language "go"}}
            - uses: actions/setup-go@v5
              with:
                go-version: '1.22'
            - run: go fmt ./...
            - run: go vet ./...
            - uses: golangci/golangci-lint-action@v4
            {{else if eq .language "typescript"}}
            - uses: actions/setup-node@v4
              with:
                node-version: '20'
            - run: npm ci
            - run: npm run lint
            {{else if eq .language "python"}}
            - uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            - run: pip install ruff
            - run: ruff check .
            {{else if eq .language "rust"}}
            - uses: actions-rs/toolchain@v1
              with:
                toolchain: stable
                components: clippy
            - run: cargo clippy -- -D warnings
            {{end}}

        test:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            {{if eq .language "go"}}
            - uses: actions/setup-go@v5
              with:
                go-version: '1.22'
            - run: go test -v -race -coverprofile=coverage.out ./...
            - uses: codecov/codecov-action@v4
            {{else if eq .language "typescript"}}
            - uses: actions/setup-node@v4
              with:
                node-version: '20'
            - run: npm ci
            - run: npm test -- --coverage
            {{else if eq .language "python"}}
            - uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            - run: pip install pytest pytest-cov
            - run: pytest --cov=./ --cov-report=xml
            {{else if eq .language "rust"}}
            - uses: actions-rs/toolchain@v1
              with:
                toolchain: stable
            - run: cargo test --all
            {{end}}

        build:
          runs-on: ubuntu-latest
          needs: [lint, test]
          steps:
            - uses: actions/checkout@v4
            {{if eq .language "go"}}
            - uses: actions/setup-go@v5
              with:
                go-version: '1.22'
            - run: go build -o ./bin/{{.project_name}} ./...
            {{else if eq .language "typescript"}}
            - uses: actions/setup-node@v4
              with:
                node-version: '20'
            - run: npm ci
            - run: npm run build
            {{else if eq .language "python"}}
            - uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            - run: pip install build
            - run: python -m build
            {{else if eq .language "rust"}}
            - uses: actions-rs/toolchain@v1
              with:
                toolchain: stable
            - run: cargo build --release
            {{end}}
            - uses: actions/upload-artifact@v4
              with:
                name: build-artifacts
                path: |
                  {{if eq .language "go"}}./bin/{{else if eq .language "typescript"}}./dist/{{else if eq .language "python"}}./dist/{{else if eq .language "rust"}}./target/release/{{end}}

  - path: .github/workflows/security.yaml
    description: Security scanning workflow
    optional: true
    template: |
      name: Security Scan

      on:
        push:
          branches: [main]
        schedule:
          - cron: '0 0 * * 0'

      jobs:
        security:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            {{if eq .language "go"}}
            - uses: securego/gosec@master
              with:
                args: ./...
            {{else if eq .language "typescript"}}
            - uses: actions/setup-node@v4
              with:
                node-version: '20'
            - run: npm audit
            {{else if eq .language "python"}}
            - uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            - run: pip install bandit safety
            - run: bandit -r .
            - run: safety check
            {{else if eq .language "rust"}}
            - uses: actions-rs/audit-check@v1
              with:
                token: ${{"{{"}} secrets.GITHUB_TOKEN {{"}}"}}
            {{end}}

        dependency-review:
          runs-on: ubuntu-latest
          if: github.event_name == 'pull_request'
          steps:
            - uses: actions/checkout@v4
            - uses: actions/dependency-review-action@v4

  - path: .github/workflows/release.yaml
    description: Release workflow for versioning and publishing
    template: |
      name: Release

      on:
        push:
          tags:
            - 'v*'

      jobs:
        release:
          runs-on: ubuntu-latest
          permissions:
            contents: write
          steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 0

            {{if eq .language "go"}}
            - uses: actions/setup-go@v5
              with:
                go-version: '1.22'
            - uses: goreleaser/goreleaser-action@v5
              with:
                args: release --clean
              env:
                GITHUB_TOKEN: ${{"{{"}} secrets.GITHUB_TOKEN {{"}}"}}
            {{else}}
            - uses: actions/download-artifact@v4
              with:
                name: build-artifacts

            - uses: softprops/action-gh-release@v1
              with:
                generate_release_notes: true
                files: |
                  {{if eq .language "typescript"}}./dist/**{{else if eq .language "python"}}./dist/**{{else if eq .language "rust"}}./target/release/**{{end}}
            {{end}}
