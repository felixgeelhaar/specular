# nox configuration — the single security scanner for this repo.
# Schema reference: https://github.com/nox-hq/nox
#
# This replaces .verdict/, which configured VerdictSec (discontinued upstream).
# None of its settings carried over: its suppressions were gosec rule IDs
# (G104/G204) that have no nox equivalent, and its exclusions blinded
# **/*_test.go, **/mock_*.go and **/mocks/**. First-party Go source is scanned
# here in full, tests included — a finding in test code is still a finding, and
# a directory excluded from scanning cannot be reviewed later.

plugins:
  # Installing a plugin does NOT make it run. nox only executes plugins listed
  # here; anything installed but unlisted is reported as [degraded] and its
  # findings are simply absent from the scan. A CI job that installs the taint
  # plugin without this list produces a green scan with no SAST coverage, which
  # is indistinguishable from a clean one.
  required:
    # Source-to-sink taint analysis: SSRF, injection, path traversal.
    - nox/taint-analysis

scan:
  exclude:
    # Markdown is prose — README, CHANGELOG, docs/, reports/. The secret and
    # PII entropy rules fire on ordinary documentation (example paths, sample
    # tokens, illustrative payloads). High-confidence secret patterns are still
    # caught in code, which is where a real leak lives.
    # Classification: False Positive (prose). Last reviewed: 2026-08-03
    - "*.md"
    - "**/*.md"

    # NOTE — go.sum and package-lock.json are deliberately NOT excluded. nox
    # enumerates the dependency graph from them for OSV CVE lookups; excluding
    # either drops dependency detection toward zero and would silently disable
    # the dependency-CVE coverage this scanner exists to provide.
